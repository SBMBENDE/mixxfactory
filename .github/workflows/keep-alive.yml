name: MixxFactory Keep-Alive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/keep-alive.yml

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate keep-alive URL secret
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$KEEP_ALIVE_URL" ]; then
            echo "KEEP_ALIVE_URL secret is not configured."
            echo "Set it in GitHub: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

      - name: Ping application endpoint
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          status_code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out "%{http_code}" "$KEEP_ALIVE_URL")
          echo "Keep-alive status code: $status_code"

          if [ "$status_code" = "000" ]; then
            echo "Keep-alive failed: no HTTP response (network/timeout/DNS issue)"
            exit 1
          fi

          if [ "$status_code" -ge 500 ]; then
            echo "Keep-alive failed: server error status $status_code"
            exit 1
          fi

          echo "Keep-alive ping successful (non-5xx response)"
